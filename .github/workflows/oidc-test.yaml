name: pool-app-login
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  login:
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: azure/login@v2
        with:
          client-id: 94ee7029-53d1-4bdc-9877-e7ab4728e0a5      # registry-sp-dev-01
          tenant-id: ff15d661-959b-4d28-a340-a5251c312c3f
          allow-no-subscriptions: true
          environment: AzureUSGovernment
          audience: api://AzureADTokenExchangeUSGov
      - run: az account show --query "{tenant:tenantId, identity:user.name, type:user.type}" -o json
